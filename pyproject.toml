[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-data"
version = "0.1.0"
description = "Feed, source, and feature data-production pipelines for trading-data."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22",
    "psycopg[binary]>=3.2",
]

[project.scripts]
trading-data-feed-availability = "feed_availability.__main__:main"
trading-data-02-feed-alpaca-liquidity = "data_feed.02_feed_alpaca_liquidity.__main__:main"
trading-data-04-feed-okx-crypto-market-data = "data_feed.04_feed_okx_crypto_market_data.__main__:main"
trading-data-feed-interfaces = "feed_interfaces.__main__:main"
trading-data-01-feed-alpaca-bars = "data_feed.01_feed_alpaca_bars.__main__:main"
trading-data-03-feed-alpaca-news = "data_feed.03_feed_alpaca_news.__main__:main"
trading-data-08-feed-sec-company-financials = "data_feed.08_feed_sec_company_financials.__main__:main"
trading-data-05-feed-gdelt-news = "data_feed.05_feed_gdelt_news.__main__:main"
trading-data-07-feed-trading-economics-calendar-web = "data_feed.07_feed_trading_economics_calendar_web.__main__:main"
trading-data-06-feed-etf-holdings = "data_feed.06_feed_etf_holdings.__main__:main"
trading-data-09-feed-thetadata-option-selection-snapshot = "data_feed.09_feed_thetadata_option_selection_snapshot.__main__:main"
trading-data-10-feed-thetadata-option-primary-tracking = "data_feed.10_feed_thetadata_option_primary_tracking.__main__:main"
trading-data-11-feed-thetadata-option-event-timeline = "data_feed.11_feed_thetadata_option_event_timeline.__main__:main"
trading-data-12-feed-official-calendar-discovery = "data_feed.12_feed_official_calendar_discovery.__main__:main"
trading-data-m01-market-regime-data-acquisition = "data_source.m01_market_regime_data_acquisition.__main__:main"
trading-data-m02-sector-context-data-acquisition = "data_source.m02_sector_context_data_acquisition.__main__:main"
trading-data-m03-target-state-vector-data-acquisition = "data_source.m03_target_state_vector_data_acquisition.__main__:main"
trading-data-m05-option-expression-contract-path = "data_source.m05_option_expression_data_acquisition_contract_path.__main__:main"
trading-data-m06-residual-event-governance-data-acquisition = "data_source.m06_residual_event_governance_data_acquisition.__main__:main"
trading-data-m01-market-regime-feature-generation = "data_feature.m01_market_regime_feature_generation.__main__:main"
trading-data-m02-sector-context-feature-generation = "data_feature.m02_sector_context_feature_generation.__main__:main"
trading-data-m03-target-state-vector-feature-generation = "data_feature.m03_target_state_vector_feature_generation.__main__:main"
trading-data-m05-option-expression-feature-generation = "data_feature.m05_option_expression_feature_generation.__main__:main"
trading-data-m06-residual-event-governance-feature-generation = "data_feature.m06_residual_event_governance_feature_generation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data_source.m06_residual_event_governance_data_acquisition.equity_abnormal_activity" = ["config.json"]
