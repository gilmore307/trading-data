name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source and tests
        run: PYTHONPATH=src python3 -m compileall -q src tests
      - name: Run top-level tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Run feed tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/data_feed
      - name: Run source tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/data_source
      - name: Run feed availability tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/feed_availability
      - name: Run feed interface tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests/feed_interfaces
